<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">An HTTP request and response</title><desc id="desc">A browser requests index.html with GET. A server responds with 200 OK and HTML content.</desc>
<rect width="1000" height="340" fill="#fff"/>
<g fill="none" stroke="#142b3c" stroke-width="3"><rect x="55" y="102" width="190" height="126" rx="4"/><path d="M55 127h190M125 228v20m-32 0h115"/><rect x="755" y="93" width="190" height="154" rx="4"/><path d="M755 144h190m-190 51h190"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#142b3c"><text x="150" y="181" font-size="24">Browser</text><text x="850" y="128" font-size="22">Server</text><text x="850" y="178" font-size="17">Processes request</text><text x="850" y="228" font-size="17">Returns a resource</text><text x="150" y="289" font-size="15" fill="#53616a">CLIENT</text><text x="850" y="289" font-size="15" fill="#53616a">ORIGIN</text></g>
<path d="M285 135h420m-14-9 14 9-14 9" fill="none" stroke="#a94521" stroke-width="3"/><path d="M705 221H285m14-9-14 9 14 9" fill="none" stroke="#142b3c" stroke-width="3"/>
