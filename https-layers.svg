<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">HTTP and secure transport</title><desc id="desc">HTTPS with HTTP/1.1 or HTTP/2 typically layers HTTP over TLS over TCP. HTTP/3 maps HTTP onto QUIC, which integrates TLS 1.3 and runs over UDP.</desc>
<rect width="960" height="400" fill="#faf9f5"/>
<g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#142b3c" font-size="21" font-weight="bold"><text x="245" y="42">HTTPS with HTTP/1.1 or HTTP/2</text><text x="715" y="42">HTTP/3</text></g>
<rect x="40" y="72" width="410" height="74" fill="#142b3c"/><rect x="510" y="72" width="410" height="74" fill="#142b3c"/>
<g fill="white" font-size="22"><text x="245" y="117">HTTP semantics and messaging</text><text x="715" y="117">HTTP semantics and messaging</text></g>
<rect x="40" y="157" width="410" height="74" fill="#e8efea"/><rect x="40" y="242" width="410" height="74" fill="#e8efea"/>
<rect x="510" y="157" width="410" height="159" fill="#e8efea"/>
<g fill="#142b3c" font-size="22"><text x="245" y="201">TLS protects the connection</text><text x="245" y="286">TCP transports ordered bytes</text><text x="715" y="216">QUIC streams</text><text x="715" y="255">with integrated TLS 1.3</text></g>
<g fill="#53616a" font-size="18"><text x="245" y="357">TCP over the network</text><text x="715" y="357">QUIC over UDP</text></g></g>
</svg>
